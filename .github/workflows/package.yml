name: 'Build and deploy .NET packages'

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: '.NET Build'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Nerdbank.GitVersioning needs full history to compute the version height.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore workloads
      run: dotnet workload restore src/Uno.RevenueCat.slnx
    - name: Restore dependencies
      run: dotnet restore src/Uno.RevenueCat.slnx
    # PublicRelease=true strips Nerdbank.GitVersioning's -g<commit> suffix, so a v* tag builds a
    # stable version (0.2.0) while every other ref stays a prerelease (0.2.0-gabc1234).
    - name: Build
      run: dotnet build --no-restore -c Release src/Uno.RevenueCat.slnx -p:PublicRelease=${{ startsWith(github.ref, 'refs/tags/v') }}
    - name: Test
      run: dotnet test --no-build -c Release src/Uno.RevenueCat.Tests/Uno.RevenueCat.Tests.csproj -p:PublicRelease=${{ startsWith(github.ref, 'refs/tags/v') }}
    - name: Publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          src/**/*.nupkg
          src/**/*.snupkg

  publish:
    name: 'Publish to NuGet'
    runs-on: windows-latest
    # Publish only from a version tag, so a push to main cannot ship a release by accident.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./packages
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish to NuGet
      run: dotnet nuget push "**/*.nupkg" -k ${{ secrets.NUGETAPIKEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
