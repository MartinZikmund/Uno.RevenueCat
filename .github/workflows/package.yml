name: 'Build and deploy .NET packages'

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: '.NET Build'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Nerdbank.GitVersioning needs full history to compute the version height.
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore workloads
      run: dotnet workload restore src/Uno.RevenueCat.slnx
    - name: Restore dependencies
      run: dotnet restore src/Uno.RevenueCat.slnx
    # Pushes (main and v* tags) are public releases: Nerdbank.GitVersioning drops the -g<commit>
    # suffix, so main builds e.g. 0.3.0-beta.5 from version.json. PR builds keep the suffix.
    - name: Build
      run: dotnet build --no-restore -c Release src/Uno.RevenueCat.slnx -p:PublicRelease=${{ github.event_name == 'push' }}
    - name: Test
      run: dotnet test --no-build -c Release src/Uno.RevenueCat.Tests/Uno.RevenueCat.Tests.csproj -p:PublicRelease=${{ github.event_name == 'push' }}
    - name: Publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          src/**/*.nupkg
          src/**/*.snupkg

  publish:
    name: 'Publish to NuGet'
    runs-on: windows-latest
    # Every push to main publishes a prerelease; a stable version ships only once version.json
    # drops its prerelease label (e.g. 0.3.0-beta.{height} -> 0.3.0). Pull requests never publish.
    if: github.event_name == 'push'
    needs: build

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./packages
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish to NuGet
      run: dotnet nuget push "**/*.nupkg" -k ${{ secrets.NUGETAPIKEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
